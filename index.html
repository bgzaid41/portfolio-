<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B18">
  <title>Mohd Zaid Gaibuwale — Portfolio</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0A0B18}
    #portfolio{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="portfolio" src="./portfolio.html" title="Mohd Zaid Gaibuwale Portfolio"></iframe>
  <script>
    const frame = document.getElementById('portfolio');
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        const cv = doc && doc.getElementById('downloadCv');
        if (cv) {
          cv.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopImmediatePropagation();
            window.open('./resume.pdf', '_blank', 'noopener');
          }, true);
        }
      } catch (err) {
        console.warn('CV bridge unavailable:', err);
      }
    });
  </script>
</body>
</html>
